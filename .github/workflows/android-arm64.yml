name: Build mGBA Android ARM64

on:
  push:
    branches: [rom64]
    paths:
      - '.github/workflows/android-arm64.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DBUILD_LIBRETRO=ON -DBUILD_SDL=OFF -DBUILD_QT=OFF \
            -DBUILD_PYTHON=OFF -DBUILD_TESTS=OFF -DENABLE_UPDATER=OFF
      - name: Compile
        run: cmake --build build-android --target mgba_libretro -j 2
      - name: Verify
        run: |
          file build-android/mgba_libretro.so
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build-android/mgba_libretro.so
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-64mb-android-arm64-test
          path: build-android/mgba_libretro.so
          if-no-files-found: error
